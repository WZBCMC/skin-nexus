<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SkinNexus 像素枢纽 N —— 矢量重建版 v2（笔画 80/512，按位图主稿比例校准） -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f66ff"/>
      <stop offset="0.55" stop-color="#2a8fe0"/>
      <stop offset="1" stop-color="#20b983"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2f66ff" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 玻璃底板 -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#plate)" stroke="#d3def8" stroke-width="2"/>

  <!-- 像素枢纽 N -->
  <g filter="url(#soft)">
    <path d="M 128 400 V 112 h 80 l 98 150 V 112 h 80 v 288 h -80 l -98 -150 v 150 z" fill="url(#ng)"/>
    <!-- 像素质感块面 -->
    <rect x="128" y="112" width="80" height="80" fill="#ffffff" opacity="0.12"/>
    <rect x="306" y="320" width="80" height="80" fill="#ffffff" opacity="0.10"/>
    <!-- 枢纽节点 + 连线（电路语义，3 节点） -->
    <path d="M 168 248 V 178 L 282 262 H 346 V 330" stroke="#ffffff" stroke-opacity="0.55" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="152" y="150" width="32" height="32" rx="6" fill="#ffffff" opacity="0.92"/>
    <rect x="266" y="246" width="32" height="32" rx="6" fill="#ffffff" opacity="0.92"/>
    <rect x="330" y="330" width="32" height="32" rx="6" fill="#eafff6" opacity="0.92"/>
  </g>
</svg>
