<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Links</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; color: #222; }
    a { display: block; margin: 8px 0; color: #2f66ff; }
    .muted { color: #777; font-size: 12px; }
  </style>
</head>
<body>
  <p>这个页面由插件静态资源提供，运行在 sandbox iframe 里。</p>
  <a href="/skinlib" target="_top">皮肤库</a>
  <a href="/user/closet" target="_top">衣柜</a>
  <p class="muted">宿主通过 postMessage 注入 locale/user/csrf。</p>
  <script>
    window.parent.postMessage({ v: 1, type: 'ready' }, '*')
    window.addEventListener('message', (e) => {
      const m = e.data
      if (!m || m.v !== 1 || m.type !== 'init') return
      document.body.dataset.pluginReady = '1'
      document.body.dataset.locale = (m.payload && m.payload.locale) || 'zh-CN'
    })
  </script>
</body>
</html>
