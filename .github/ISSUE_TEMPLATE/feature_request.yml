name: 功能建议
description: 新功能、兼容性改进或体验优化
title: "[feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景与痛点，而不是直接给实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望的接口/行为/界面；如涉及协议，请注明兼容面。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的替代做法，以及为什么不够好。
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 核心服务（Yggdrasil / OIDC / 账号 / 纹理）
        - 插件平台或官方插件
        - 主题 / 前端 / 管理面板
        - 启动器 API
        - 部署 / 迁移 / 文档
    validations:
      required: true
  - type: checkboxes
    id: compat
    attributes:
      label: 兼容性自查
      options:
        - label: 不改动 `AGENTS.md` 列出的冻结契约（Yggdrasil 语义、UUID、Union wire、插件 hook）
          required: false
        - label: 如改动持久化结构，方案包含与 blessing 存量数据的同构或迁移适配
          required: false
